name: Portfolio release gates and Pages
on:
  push:
    branches: [main, feat/workspace-v2-labstock, feat/workspace-personal-opening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_ASK_API_URL: https://adjie-workspace-ask.adjierizqan.workers.dev
      - run: npm run test:static
      - run: npx playwright install --with-deps chromium webkit
      - name: Production browser checks
        run: |
          python3 -m http.server 4182 --bind 127.0.0.1 --directory out > /tmp/portfolio-http.log 2>&1 &
          QA_WEBKIT=1 npm run test:browser
          npm run test:shell
          QA_ENGINE=webkit npm run test:shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/release/browser-results.json
            docs/release/screenshots/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
