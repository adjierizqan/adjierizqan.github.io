name: Portfolio release gates and Pages
on:
  push:
    branches: [main, feat/workspace-v2-labstock, feat/workspace-personal-opening, feat/workspace-project-intros]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_ASK_API_URL: https://adjie-workspace-ask.adjierizqan.workers.dev
      - run: npm run test:static
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        # The v2 site replaced the Workspace shell at /. The Workspace now lives
        # at /workspace/; its shell scripts still target / and are not run here.
        run: |
          python3 -m http.server 4182 --bind 127.0.0.1 --directory out > /tmp/portfolio-http.log 2>&1 &
          npm run test:v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/v2/browser-results.json
            docs/v2/screenshots/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
