<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Abstract dusk landscape</title>
  <desc id="desc">An original layered mountain and lakeside illustration in slate, rose, and amber tones.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65758d"/>
      <stop offset=".48" stop-color="#b88983"/>
      <stop offset=".72" stop-color="#e7a070"/>
      <stop offset="1" stop-color="#7a7180"/>
    </linearGradient>
    <radialGradient id="sun" cx=".58" cy=".48" r=".3">
      <stop offset="0" stop-color="#ffd59b" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#ee9b74" stop-opacity=".4"/>
      <stop offset="1" stop-color="#e68a70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#596779"/>
      <stop offset="1" stop-color="#182434"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4150"/>
      <stop offset="1" stop-color="#17222c"/>
